name: Build iPad Keyboard

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show runner environment
        run: |
          echo "=== RUNNER ==="
          echo "OS: $RUNNER_OS"
          echo "ARCH: $RUNNER_ARCH"
          uname -a
          echo "=== XCODE ==="
          xcodebuild -version
          echo "=== IOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "=== DISK ==="
          df -h
          echo "=== MEMORY ==="
          sysctl hw.memsize

      - name: Show project structure
        run: |
          xcodebuild -list \
            -project "_28hangul.xcodeproj"

      - name: Show deployment targets
        run: |
          xcodebuild \
            -showBuildSettings \
            -project "_28hangul.xcodeproj" \
            -scheme "_28hangul" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            | grep "IPHONEOS_DEPLOYMENT_TARGET"

      - name: Build app and keyboard extension
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "_28hangul.xcodeproj" \
            -scheme "_28hangul" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Verify app
        run: |
          find "$PWD/DerivedData" \
            -type d -name "*.app" \
            -print

      - name: Verify keyboard extension
        run: |
          find "$PWD/DerivedData" \
            -path "*.app/PlugIns/*.appex" \
            -print

      - name: Verify font
        run: |
          find "$PWD/DerivedData" \
            -path "*.app/HCRBatang.ttf" \
            -print
      - name: Create unsigned IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/_28hangul.app" \
                "$GITHUB_WORKSPACE/ipa/Payload/_28hangul.app"
          cd "$GITHUB_WORKSPACE/ipa"
          zip -qry "$GITHUB_WORKSPACE/oldhangulkeyboard-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: oldhangulkeyboard-unsigned-ipa
          path: oldhangulkeyboard-unsigned.ipa
          
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: oldhangulkeyboard-unsigned
          path: DerivedData/Build/Products/Release-iphoneos/_28hangul.app

      - name: Create signed IPA
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          APP_SOURCE="$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos/_28hangul.app"
          SIGN_ROOT="$RUNNER_TEMP/signed"
          APP_PATH="$SIGN_ROOT/Payload/_28hangul.app"
          EXT_PATH="$APP_PATH/PlugIns/oldHangulKeyboard.appex"

          CERT_PATH="$RUNNER_TEMP/인증서.p12"
          MAIN_PROFILE="$RUNNER_TEMP/main.mobileprovision"
          KEYBOARD_PROFILE="$RUNNER_TEMP/keyboard.mobileprovision"

          MAIN_PROFILE_PLIST="$RUNNER_TEMP/main-profile.plist"
          KEYBOARD_PROFILE_PLIST="$RUNNER_TEMP/keyboard-profile.plist"
          MAIN_ENTITLEMENTS="$RUNNER_TEMP/main-entitlements.plist"
          KEYBOARD_ENTITLEMENTS="$RUNNER_TEMP/keyboard-entitlements.plist"

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo '${{ secrets.CERTIFICATE_P12 }}' | base64 -D > "$CERT_PATH"
          echo '${{ secrets.MAIN_PROVISIONING_PROFILE }}' | base64 -D > "$MAIN_PROFILE"
          echo '${{ secrets.KEYBOARD_PROVISIONING_PROFILE }}' | base64 -D > "$KEYBOARD_PROFILE"

          rm -rf "$SIGN_ROOT"
          mkdir -p "$SIGN_ROOT/Payload"
          cp -R "$APP_SOURCE" "$APP_PATH"

          security cms -D -i "$MAIN_PROFILE" > "$MAIN_PROFILE_PLIST"
          security cms -D -i "$KEYBOARD_PROFILE" > "$KEYBOARD_PROFILE_PLIST"

          plutil -extract Entitlements xml1 -o "$MAIN_ENTITLEMENTS" "$MAIN_PROFILE_PLIST"
          plutil -extract Entitlements xml1 -o "$KEYBOARD_ENTITLEMENTS" "$KEYBOARD_PROFILE_PLIST"

          cp "$MAIN_PROFILE" "$APP_PATH/embedded.mobileprovision"
          cp "$KEYBOARD_PROFILE" "$EXT_PATH/embedded.mobileprovision"

                    security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "===== Signing identities ====="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Apple Development:.*\)"/\1/p' \
              | head -n 1
          )"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Apple Development signing identity not found"
            exit 1
          fi

          echo "Using signing identity: $SIGNING_IDENTITY"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Apple Development signing identity not found"
            exit 1
          fi

          MAIN_BUNDLE_ID="$(defaults read "$APP_PATH/Info" CFBundleIdentifier)"
          KEYBOARD_BUNDLE_ID="$(defaults read "$EXT_PATH/Info" CFBundleIdentifier)"

          MAIN_PROFILE_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$MAIN_PROFILE_PLIST")"
          KEYBOARD_PROFILE_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$KEYBOARD_PROFILE_PLIST")"

          test "$MAIN_PROFILE_ID" = "63W9KYRU65.$MAIN_BUNDLE_ID"
          test "$KEYBOARD_PROFILE_ID" = "63W9KYRU65.$KEYBOARD_BUNDLE_ID"

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "$KEYBOARD_ENTITLEMENTS" \
            "$EXT_PATH"

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "$MAIN_ENTITLEMENTS" \
            "$APP_PATH"

          codesign --verify --strict --verbose=2 "$EXT_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

          cd "$SIGN_ROOT"
          zip -qry "$GITHUB_WORKSPACE/oldhangulkeyboard-signed.ipa" Payload

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: oldhangulkeyboard-signed
          path: oldhangulkeyboard-signed.ipa
