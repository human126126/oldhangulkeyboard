name: Build iPad Keyboard

on:
  workflow_dispatch:

    push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show iOS SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Show project structure
        run: |
          xcodebuild -list \
            -project "_28hangul.xcodeproj"

      - name: Build app and keyboard extension
        run: |
          xcodebuild clean build \
            -project "_28hangul.xcodeproj" \
            -scheme "_28hangul" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app
        run: |
          find "$PWD/DerivedData" \
            -type d -name "*.app" \
            -print

      - name: Verify keyboard extension
        run: |
          find "$PWD/DerivedData" \
            -path "*.app/PlugIns/*.appex" \
            -print

      - name: Verify font
        run: |
          find "$PWD/DerivedData" \
            -path "*.app/HCRBatang.ttf" \
            -print

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: oldhangulkeyboard-unsigned
          path: DerivedData/Build/Products/Release-iphoneos/_28hangul.app
